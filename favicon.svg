<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4A623"/>
      <stop offset="60%" stop-color="#E8652E"/>
      <stop offset="100%" stop-color="#C44B1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#C44B1A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A1611" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1A1611"/>
  <rect width="32" height="32" rx="4" fill="url(#glow)"/>

  <!-- Anvil body -->
  <rect x="7" y="17" width="18" height="7" rx="1" fill="url(#ember)"/>

  <!-- Anvil horn (left) -->
  <path d="M7 18 Q3 20 4 24 L7 24 Z" fill="url(#ember)"/>

  <!-- Anvil top face -->
  <rect x="9" y="13" width="14" height="5" rx="1" fill="url(#ember)"/>

  <!-- Anvil base -->
  <rect x="10" y="24" width="12" height="2.5" rx="1" fill="#C44B1A"/>

  <!-- Hammer head -->
  <rect x="13" y="5" width="9" height="5" rx="1" fill="#F5F0E8" opacity="0.9" transform="rotate(-20 17 7)"/>

  <!-- Hammer handle -->
  <rect x="16" y="9" width="2" height="7" rx="0.5" fill="#F5F0E8" opacity="0.75" transform="rotate(-20 17 7)"/>

  <!-- Ember spark -->
  <circle cx="22" cy="12" r="1" fill="#F4A623" opacity="0.8"/>
  <circle cx="25" cy="9" r="0.6" fill="#F4A623" opacity="0.5"/>
</svg>
